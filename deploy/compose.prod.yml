services:
  ai-v2:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${AI_ENV_FILE:-/opt/hrconnect/deploy/env/ai-v2.env}
    ports:
      - "127.0.0.1:${AI_HOST_PORT:?AI_HOST_PORT is required}:8001"
    environment:
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=2
      - TORCH_NUM_THREADS=2
      - DEPLOY_COLOR=${DEPLOY_COLOR:?DEPLOY_COLOR is required}
      - SCORING_QUEUE_FILE=/var/lib/hrconnect-ai/pending-scoring-jobs.json
      - SCORING_ACTIVE_COLOR_FILE=/var/lib/hrconnect-ai/active-color
      - SCORING_ACTIVATION_POLL_SECONDS=0.25
    volumes:
      - ${AI_DATA_DIR:-/opt/hrconnect/deploy/data/ai-v2}:/var/lib/hrconnect-ai
    mem_limit: 1200m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/hrconnect/deploy/env/backend.env}
    environment:
      - DOTNET_GCHeapHardLimitPercent=70
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:?BACKEND_HOST_PORT is required}:8080"
    mem_limit: 1400m
    cpus: 1.5
    depends_on:
      ai-v2:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - internal

networks:
  internal:
    driver: bridge
