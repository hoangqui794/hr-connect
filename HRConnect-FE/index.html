              <li><strong>Affiliate:</strong> Giới thiệu ứng viên tài năng, theo dõi tiến độ ứng tuyển và nhận hoa hồng bảo hành minh bạch.</li>
              <li><strong>Ứng viên (Candidate):</strong> Khám phá cơ hội việc làm mơ ước, bảo mật thông tin và nhận gợi ý nghề nghiệp phù hợp.</li>
