name: HRConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.dockerignore'

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------
  # 1. CI JOB: Restore, Build, Check code quality
  # -----------------------------------------------------------
  ci:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore HRConnect/HRConnect.sln

      - name: Build Solution (Release)
        run: dotnet build HRConnect/HRConnect.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test HRConnect/HRConnect.sln --configuration Release --no-build --verbosity normal

  # -----------------------------------------------------------
  # 2. CD JOB: Build Docker Image & Deploy to Production
  # Kích hoạt DUY NHẤT khi merge / push vào nhánh main và CI thành công
  # -----------------------------------------------------------
  cd:
    name: Deploy to Production (CD)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./HRConnect
          file: ./HRConnect/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy backend lên Render bằng Deploy Hook, chỉ khi CI pass (job này needs: ci).
      # Secret RENDER_DEPLOY_HOOK_URL: Render > service backend > Settings > Deploy Hook.
      # Nên tắt Auto-Deploy của service trên Render để không deploy 2 lần cho cùng một commit.
      - name: Trigger Render Deployment (CD)
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; skipping Render deployment."
            exit 0
          fi
          echo "CI passed! Triggering deployment to Render..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy hook sent successfully!"
