name: HRConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.dockerignore'

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  # -----------------------------------------------------------
  # 1. CI JOB: Restore, Build, Check code quality
  # -----------------------------------------------------------
  ci:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore HRConnect/HRConnect.sln

      - name: Build Solution (Release)
        run: dotnet build HRConnect/HRConnect.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test HRConnect/HRConnect.sln --configuration Release --no-build --verbosity normal

  # -----------------------------------------------------------
  # 2. CD JOB: Build Docker Image & Deploy to Production
  # Kích hoạt DUY NHẤT khi merge / push vào nhánh main và CI thành công
  # -----------------------------------------------------------
  cd:
    name: Deploy to Production (CD)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./HRConnect
          file: ./HRConnect/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy lên Render và theo dõi trạng thái ─────────────────
      # Secrets cần thiết (GitHub > repo > Settings > Secrets):
      #   RENDER_API_KEY      : Render > Account Settings > API Keys
      #   RENDER_SERVICE_ID   : Render > service > Settings > ID (srv-...)
      #   RENDER_DEPLOY_HOOK_URL : (tùy chọn, fallback nếu không có API key)
      - name: Deploy to Render & Wait for Result
        if: success()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # ── Nếu có API key: dùng Render API để deploy + poll status ──
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "🚀 Triggering deploy via Render API..."
            DEPLOY_RESPONSE=$(curl -sS -X POST \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{}')

            DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" | jq -r '.id // empty')
            if [ -z "$DEPLOY_ID" ]; then
              echo "::error::Không thể tạo deploy. Response: $DEPLOY_RESPONSE"
              exit 1
            fi
            echo "📦 Deploy ID: $DEPLOY_ID"

            # ── Poll trạng thái mỗi 30s, tối đa 15 phút ──
            MAX_WAIT=900
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep 30
              ELAPSED=$((ELAPSED + 30))

              STATUS_RESPONSE=$(curl -sS \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
                -H "Authorization: Bearer $RENDER_API_KEY")
              STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // empty')

              echo "⏳ [$ELAPSED s] Deploy status: $STATUS"

              case "$STATUS" in
                live)
                  echo "✅ Deploy thành công!"
                  exit 0
                  ;;
                deactivated|canceled|build_failed|update_failed)
                  echo "::error::❌ Deploy thất bại với status: $STATUS"
                  # In thêm log nếu có
                  echo "$STATUS_RESPONSE" | jq '.commit, .finishedAt' 2>/dev/null || true
                  exit 1
                  ;;
                *)
                  # Đang build/deploy, tiếp tục chờ
                  ;;
              esac
            done

            echo "::error::⏰ Deploy timeout sau ${MAX_WAIT}s. Status cuối: $STATUS"
            exit 1

          # ── Fallback: dùng deploy hook (không theo dõi status) ──
          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_API_KEY chưa set. Dùng deploy hook (không theo dõi status)."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
            echo "Deploy hook sent — kiểm tra status trên Render dashboard."
          else
            echo "::warning::Không có RENDER_API_KEY hoặc RENDER_DEPLOY_HOOK_URL; bỏ qua deploy."
          fi
