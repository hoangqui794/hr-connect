name: CI — Quality Gates

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  delivery-scripts:
    name: Delivery / Validate deployment scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate cloud deployment workflow
        run: bash .github/scripts/deploy-cloud.test.sh

  backend:
    name: Backend / Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('HRConnect/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore HRConnect/HRConnect.sln

      - name: Build release binaries
        run: dotnet build HRConnect/HRConnect.sln --configuration Release --no-restore

      - name: Run backend tests with coverage
        run: >-
          dotnet test HRConnect/HRConnect.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory artifacts/backend-tests
          --collect "XPlat Code Coverage"

      - name: Enforce backend coverage baseline
        run: >-
          python .github/scripts/check-cobertura-threshold.py
          "artifacts/backend-tests/**/coverage.cobertura.xml"
          8

      - name: Publish backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_id }}
          path: artifacts/backend-tests
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend / Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: HRConnect-FE

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HRConnect-FE/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce lint rules
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Publish production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: HRConnect-FE/dist
          if-no-files-found: error
          retention-days: 7

  frontend-tests:
    name: Frontend / Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    defaults:
      run:
        shell: bash
        working-directory: HRConnect-FE

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HRConnect-FE/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend test shard
        run: >-
          npm test --
          --shard=${{ matrix.shard }}/2
          --reporter=default
          --reporter=junit
          --outputFile.junit=../artifacts/frontend-tests/shard-${{ matrix.shard }}.xml

      - name: Publish frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: artifacts/frontend-tests/shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-coverage:
    name: Frontend / Critical coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: HRConnect-FE

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HRConnect-FE/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce critical frontend coverage
        run: npm run test:coverage:critical

      - name: Publish frontend coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: HRConnect-FE/coverage
          if-no-files-found: warn
          retention-days: 14

  ai-service:
    name: AI service / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ai-service-v2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service-v2/requirements.txt

      - name: Install CPU runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov

      - name: Validate Python modules
        run: python -m compileall -q app tests

      - name: Run AI service tests
        run: >-
          python -m pytest -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:../artifacts/ai-tests/coverage.xml
          --cov-fail-under=60
          --junitxml=../artifacts/ai-tests/junit.xml

      - name: Publish AI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results-${{ github.run_id }}
          path: artifacts/ai-tests
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security / Dependency and filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare evidence directory
        run: mkdir -p artifacts/security

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Audit .NET dependencies
        run: |
          dotnet restore HRConnect/HRConnect.sln
          dotnet list HRConnect/HRConnect.sln package --vulnerable --include-transitive --format json \
            > artifacts/security/dotnet-vulnerabilities.json
          count="$(jq '[.projects[]?.frameworks[]? | (((.topLevelPackages // []) + (.transitivePackages // []))[]?) | .vulnerabilities[]? | select((.severity | ascii_downcase) == "high" or (.severity | ascii_downcase) == "critical")] | length' artifacts/security/dotnet-vulnerabilities.json)"
          test "$count" -eq 0 || { echo "::error::$count High/Critical .NET vulnerabilities found"; exit 1; }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HRConnect-FE/package-lock.json

      - name: Audit production frontend dependencies
        working-directory: HRConnect-FE
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high --json > ../artifacts/security/npm-audit.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service-v2/requirements.txt

      - name: Audit AI dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r ai-service-v2/requirements.txt --format json \
            --output artifacts/security/pip-audit.json

      - name: Scan repository for High/Critical vulnerabilities (table report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan repository for High/Critical vulnerabilities (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '0'
          format: sarif
          output: artifacts/security/trivy.sarif

      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.run_id }}
          path: artifacts/security
          if-no-files-found: warn
          retention-days: 14

  frontend-e2e:
    name: Frontend / E2E smoke
    needs:
      - frontend
      - frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: HRConnect-FE

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HRConnect-FE/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run desktop smoke journey
        run: npm run test:e2e -- --project=desktop-chromium

      - name: Publish E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-${{ github.run_id }}
          path: |
            HRConnect-FE/playwright-report
            HRConnect-FE/test-results
          if-no-files-found: warn
          retention-days: 14

  backend-container:
    name: Backend / Validate production image
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: HRConnect
          file: HRConnect/Dockerfile
          push: false
          tags: hrconnect/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  ci-success:
    name: CI / Required gate
    if: always()
    needs:
      - backend
      - frontend
      - frontend-tests
      - frontend-coverage
      - frontend-e2e
      - ai-service
      - security
      - backend-container
      - delivery-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Verify every quality gate passed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend-tests.result }}
          FRONTEND_COVERAGE_RESULT: ${{ needs.frontend-coverage.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          AI_RESULT: ${{ needs.ai-service.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CONTAINER_RESULT: ${{ needs.backend-container.result }}
          DELIVERY_RESULT: ${{ needs.delivery-scripts.result }}
        run: |
          printf 'Backend: %s\nFrontend build: %s\nFrontend tests: %s\nFrontend coverage: %s\nFrontend E2E: %s\nAI service: %s\nSecurity: %s\nContainer: %s\nDelivery scripts: %s\n' \
            "$BACKEND_RESULT" "$FRONTEND_BUILD_RESULT" "$FRONTEND_TEST_RESULT" \
            "$FRONTEND_COVERAGE_RESULT" "$FRONTEND_E2E_RESULT" "$AI_RESULT" \
            "$SECURITY_RESULT" "$CONTAINER_RESULT" "$DELIVERY_RESULT"

          if [[ "$BACKEND_RESULT" != success \
            || "$FRONTEND_BUILD_RESULT" != success \
            || "$FRONTEND_TEST_RESULT" != success \
            || "$FRONTEND_COVERAGE_RESULT" != success \
            || "$FRONTEND_E2E_RESULT" != success \
            || "$AI_RESULT" != success \
            || "$SECURITY_RESULT" != success \
            || "$CONTAINER_RESULT" != success \
            || "$DELIVERY_RESULT" != success ]]; then
            echo '::error::At least one required quality gate failed.'
            exit 1
          fi
