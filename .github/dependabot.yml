version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /HRConnect-FE
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /HRConnect
    schedule:
      interval: weekly
    labels:
      - dependencies
      - backend
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /ai-service-v2
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ai-service
    open-pull-requests-limit: 5
