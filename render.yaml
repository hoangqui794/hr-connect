# Render Blueprint for the MF-03 AI Matching Service.
# Render dashboard: New > Blueprint > pick this repo. Secrets marked sync: false are asked for on first deploy.
services:
  - type: web
    name: hrconnect-ai-service
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # MiniLM peaks around 1.4 GB RAM; starter (512 MB) and free run out of memory.
    plan: standard
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: SEMANTIC_MATCH_THRESHOLD
        value: "0.35"
      - key: SEMANTIC_FLOOR
        value: "0.10"
      - key: SEMANTIC_CEILING
        value: "0.55"
      - key: EVIDENCE_CREDIT_THRESHOLD
        value: "0.65"
      # Cross-encoder reranker needs ~0.5 GB more RAM; enable on the pro plan:
      # cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      - key: RERANKER_MODEL
        value: ""
      - key: SEMANTIC_GATED_BY_MUST_HAVE
        value: "true"
      - key: KNOCKOUT_SCORE_CAP
        value: "59"
      - key: LOG_LEVEL
        value: INFO
      - key: OCR_LANGUAGES
        value: vi,en
      - key: OCR_MAX_CONCURRENCY
        value: "1"
      - key: SCORING_WORKER_COUNT
        value: "1"
      - key: HRCONNECT_VERIFY_SSL
        value: "true"
      - key: ALLOW_UNAUTHENTICATED_TEST_ENDPOINTS
        value: "false"
      # Public URL of the HR Connect backend, e.g. https://hrconnect-api.onrender.com
      - key: HRCONNECT_BASE_URL
        sync: false
      # Must equal Mf03Integration__ServiceToken on the backend.
      - key: HRCONNECT_SERVICE_TOKEN
        sync: false
