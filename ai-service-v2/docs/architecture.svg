<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#f8fafc"/>

  <!-- Title -->
  <text x="700" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">HR Connect AI Service v2 — Mô hình chấm điểm CV</text>
  <text x="700" y="80" text-anchor="middle" font-size="16" fill="#475569">LLM đọc CV và đánh giá từng yêu cầu · Code kiểm tra bằng chứng và tính điểm · HR ra quyết định</text>

  <!-- ========== Row 1: inputs ========== -->
  <g>
    <rect x="60" y="120" width="300" height="150" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="210" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">① Đầu vào</text>
    <text x="80" y="185" font-size="15" fill="#334155">• CV: PDF có chữ, PDF scan,</text>
    <text x="92" y="207" font-size="15" fill="#334155">ảnh (PNG/JPG), DOCX</text>
    <text x="80" y="232" font-size="15" fill="#334155">• JD: danh sách yêu cầu</text>
    <text x="92" y="254" font-size="15" fill="#334155">MUST_HAVE / SHOULD_HAVE</text>
  </g>

  <g>
    <rect x="430" y="120" width="300" height="150" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="580" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">② Chuẩn bị tài liệu</text>
    <text x="450" y="185" font-size="15" fill="#334155">• Gửi nguyên PDF/ảnh cho LLM</text>
    <text x="450" y="210" font-size="15" fill="#334155">• PyMuPDF đọc riêng phần chữ</text>
    <text x="462" y="232" font-size="15" fill="#334155">→ bản đối chiếu độc lập</text>
    <text x="450" y="257" font-size="15" fill="#334155">• CV ảnh/scan: không có bản chữ</text>
  </g>

  <g>
    <rect x="800" y="110" width="540" height="170" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="1070" y="144" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">③ LLM (Claude) — 1 lần gọi / CV</text>
    <text x="822" y="178" font-size="15" fill="#3b0764">• Đọc CV mọi ngành, tiếng Việt/Anh, cả bản scan và ảnh</text>
    <text x="822" y="203" font-size="15" fill="#3b0764">• Mỗi yêu cầu: MATCHED / PARTIAL / NOT_FOUND / UNKNOWN</text>
    <text x="822" y="228" font-size="15" fill="#3b0764">• Kèm câu trích NGUYÊN VĂN từ CV + lý do + số năm liên quan</text>
    <text x="822" y="253" font-size="15" fill="#3b0764">• Trả JSON theo schema cố định · JD được cache · KHÔNG cho điểm</text>
  </g>

  <line x1="360" y1="195" x2="426" y2="195" stroke="#475569" stroke-width="2.5"/>
  <line x1="730" y1="195" x2="796" y2="195" stroke="#475569" stroke-width="2.5"/>

  <!-- ========== Row 2: verification ========== -->
  <line x1="1070" y1="280" x2="1070" y2="330" stroke="#475569" stroke-width="2.5"/>
  <line x1="1070" y1="330" x2="700" y2="330" stroke="#475569" stroke-width="2.5"/>
  <line x1="700" y1="330" x2="700" y2="356" stroke="#475569" stroke-width="2.5"/>
  <path d="M580,270 L580,330 L700,330" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="590" y="320" font-size="13" fill="#475569">bản chữ đối chiếu</text>

  <g>
    <rect x="250" y="360" width="900" height="200" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="700" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f">④ Code kiểm tra bằng chứng (chống AI "bịa")</text>
    <text x="275" y="430" font-size="15" fill="#451a03">• Câu trích phải có thật trong CV (bỏ qua hoa/thường, xuống dòng, chữ ghép "fi/fl"; so theo nguyên từ)</text>
    <text x="275" y="457" font-size="15" fill="#451a03">• Câu trích không có thật → không bao giờ được cộng điểm: hạ xuống PARTIAL + cần người xem</text>
    <text x="275" y="484" font-size="15" fill="#451a03">• Yêu cầu số năm: code tự so lại với minYears (AI nói đạt mà thiếu năm → PARTIAL)</text>
    <text x="275" y="511" font-size="15" fill="#451a03">• AI bỏ sót yêu cầu → UNKNOWN · CV ảnh/scan → luôn cần người xem</text>
    <text x="275" y="538" font-size="15" fill="#451a03">• LLM lỗi / từ chối / bị cắt → HTTP 503: hồ sơ chuyển HR xem thủ công, KHÔNG bị loại</text>
  </g>

  <!-- ========== Row 3: score parts ========== -->
  <line x1="460" y1="560" x2="300" y2="616" stroke="#475569" stroke-width="2.5"/>
  <line x1="700" y1="560" x2="700" y2="616" stroke="#475569" stroke-width="2.5"/>
  <line x1="940" y1="560" x2="1100" y2="616" stroke="#475569" stroke-width="2.5"/>

  <g>
    <rect x="60" y="620" width="420" height="140" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="270" y="654" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">⑤a Yêu cầu bắt buộc + mong muốn</text>
    <text x="80" y="688" font-size="15" fill="#052e16">MATCHED = 1 · PARTIAL = 0,5 · còn lại = 0</text>
    <text x="80" y="714" font-size="15" fill="#052e16">MUST_HAVE: <tspan font-weight="700">50%</tspan>   SHOULD_HAVE: <tspan font-weight="700">20%</tspan></text>
    <text x="80" y="740" font-size="15" fill="#052e16">Thiếu hẳn 1 MUST_HAVE → điểm tối đa 59</text>
  </g>

  <g>
    <rect x="510" y="620" width="380" height="140" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="700" y="654" text-anchor="middle" font-size="19" font-weight="700" fill="#0c4a6e">⑤b Sentence-BERT</text>
    <text x="530" y="688" font-size="15" fill="#082f49">Độ giống nghĩa CV–JD (đúng yêu cầu đề tài)</text>
    <text x="530" y="714" font-size="15" fill="#082f49">paraphrase-multilingual-MiniLM-L12-v2</text>
    <text x="530" y="740" font-size="15" fill="#082f49">Trọng số: <tspan font-weight="700">30%</tspan> (chạy ngay trên máy chủ)</text>
  </g>

  <g>
    <rect x="920" y="620" width="420" height="140" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="1130" y="654" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">⑤c Phù hợp tổng thể (đề xuất)</text>
    <text x="940" y="688" font-size="15" fill="#3b0764">LLM chọn 1 trong 5 mức theo thang mô tả,</text>
    <text x="940" y="714" font-size="15" fill="#3b0764">kèm câu trích; code đổi mức ra điểm</text>
    <text x="940" y="740" font-size="15" fill="#3b0764">Chia lại 30% với ⑤b qua cấu hình .env</text>
  </g>

  <!-- ========== Row 4: result ========== -->
  <line x1="270" y1="760" x2="560" y2="826" stroke="#475569" stroke-width="2.5"/>
  <line x1="700" y1="760" x2="700" y2="826" stroke="#475569" stroke-width="2.5"/>
  <line x1="1130" y1="760" x2="840" y2="826" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>

  <g>
    <rect x="330" y="830" width="740" height="120" rx="14" fill="#0f172a"/>
    <text x="700" y="866" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">⑥ Kết quả trả về backend (.NET) — cùng định dạng API v1</text>
    <text x="700" y="898" text-anchor="middle" font-size="16" fill="#e2e8f0">Điểm 0–100 (do CODE tính) · Trạng thái + câu trích từng yêu cầu · Tóm tắt ứng viên</text>
    <text x="700" y="926" text-anchor="middle" font-size="16" fill="#fde68a">Cờ "cần người xem" + lý do → HR là người quyết định cuối cùng</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#475569">
    <rect x="60" y="836" width="18" height="12" fill="#ede9fe" stroke="#7c3aed"/><text x="84" y="847">LLM (gọi API)</text>
    <rect x="60" y="860" width="18" height="12" fill="#fef3c7" stroke="#d97706"/><text x="84" y="871">Kiểm tra bằng code</text>
    <rect x="60" y="884" width="18" height="12" fill="#e0f2fe" stroke="#0284c7"/><text x="84" y="895">Chạy trên máy chủ</text>
    <line x1="60" y1="914" x2="78" y2="914" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><text x="84" y="918">Đề xuất / phụ</text>
  </g>
  <!-- explicit arrowheads (PNG renderers ignore markers) -->
  <polygon points="426.0,195.0 412.0,188.0 412.0,202.0" fill="#475569"/>
  <polygon points="796.0,195.0 782.0,188.0 782.0,202.0" fill="#475569"/>
  <polygon points="700.0,356.0 707.0,342.0 693.0,342.0" fill="#475569"/>
  <polygon points="300.0,616.0 315.5,618.0 310.9,604.8" fill="#475569"/>
  <polygon points="700.0,616.0 707.0,602.0 693.0,602.0" fill="#475569"/>
  <polygon points="1100.0,616.0 1089.1,604.8 1084.5,618.0" fill="#475569"/>
  <polygon points="560.0,826.0 547.9,816.1 544.8,829.7" fill="#475569"/>
  <polygon points="700.0,826.0 707.0,812.0 693.0,812.0" fill="#475569"/>
  <polygon points="840.0,826.0 855.2,829.7 852.1,816.1" fill="#475569"/>
</svg>
